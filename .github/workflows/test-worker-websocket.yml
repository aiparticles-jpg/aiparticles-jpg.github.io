name: Test Worker WebSocket

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-worker-websocket.yml"

jobs:
  websocket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install WebSocket client
        run: npm install --no-save ws@8

      - name: Connect to Worker from GitHub runner
        run: |
          node <<'NODE'
          const WebSocket = require("ws");

          const url = "wss://p2p-voice-signaling.zaliaevdamir.workers.dev/ws/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa";
          const ws = new WebSocket(url, {
            origin: "https://aiparticles-jpg.github.io"
          });

          let finished = false;
          const timer = setTimeout(() => {
            if (finished) return;
            finished = true;
            console.error("TIMEOUT: no joined message within 10 seconds");
            ws.terminate();
            process.exit(1);
          }, 10000);

          ws.on("open", () => {
            console.log("WebSocket handshake: OPEN");
          });

          ws.on("message", (data) => {
            const message = data.toString();
            console.log("Received:", message);

            let parsed;
            try {
              parsed = JSON.parse(message);
            } catch {
              finished = true;
              clearTimeout(timer);
              console.error("FAIL: response is not valid JSON");
              ws.terminate();
              process.exit(1);
            }

            if (parsed.type === "joined" && parsed.peerCount === 1) {
              finished = true;
              clearTimeout(timer);
              console.log("PASS: Worker accepted the connection and returned joined.");
              ws.close(1000, "test complete");
              process.exit(0);
            }
          });

          ws.on("error", (error) => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            console.error("FAIL: WebSocket error:", error.message);
            process.exit(1);
          });

          ws.on("close", (code, reason) => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            console.error("FAIL: connection closed before joined:", code, reason.toString());
            process.exit(1);
          });
          NODE
