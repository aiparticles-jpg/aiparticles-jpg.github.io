name: Batch browser transport probe
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/storage-api-probe.mjs"
      - ".github/workflows/storage-api-probe.yml"
permissions:
  contents: read
concurrency:
  group: batch-browser-transport-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm install --no-save mqtt@^5 playwright@^1.56 nostr-tools@^2
          npx playwright install --with-deps chromium
      - name: Run independent probes
        shell: bash
        run: |
          set -o pipefail
          node experiments/storage-api-probe.mjs | tee storage-probe.log
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f storage-probe.log ]; then
            { echo "## Batch browser transport probe"; echo; cat storage-probe.log; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-browser-transport-probe
          path: storage-probe.log
          if-no-files-found: ignore
          retention-days: 7
