name: Deploy GitHub Pages (recovery)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Separate concurrency group to bypass the stuck "pages" queue.
concurrency:
  group: pages-recovery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate application version
        shell: bash
        run: |
          COMMIT_TIMESTAMP=$(git show -s --format=%ct HEAD)
          VERSION_DATE=$(date -u -d "@${COMMIT_TIMESTAMP}" +%Y.%m.%d)
          APP_VERSION=$(python3 - "${VERSION_DATE}" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          version_date = sys.argv[1]
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'id="app-version"[^>]*>Версия (\\d{4}\\.\\d{2}\\.\\d+)-(\\d+)', html)
          if not match:
              raise SystemExit("Could not read the base application version from index.html")

          base_version = match.group(0).split("Версия ", 1)[1]
          base_minor = int(match.group(2))
          base_commit = subprocess.check_output(
              ["git", "log", "-1", "-S", f"Версия {base_version}", "--format=%H", "--", "index.html"],
              text=True,
          ).strip()
          if not base_commit:
              raise SystemExit("Could not find the commit that introduced the base application version")

          commits_after_base = int(subprocess.check_output(
              ["git", "rev-list", "--count", f"{base_commit}..HEAD"],
              text=True,
          ).strip())
          print(f"{version_date}-{base_minor + commits_after_base}")
          PY
          )
          CACHE_VERSION=$(git rev-parse --short=12 HEAD)

          python3 - "${APP_VERSION}" "${CACHE_VERSION}" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, cache_version = sys.argv[1:3]
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          html, version_count = re.subn(
              r'(id="app-version"[^>]*>Версия )\\d{4}\\.\\d{2}\\.\\d{2}-\\d+',
              lambda match: match.group(1) + version,
              html,
              count=1,
          )
          if version_count != 1:
              raise SystemExit("Could not find the application version marker in index.html")

          html, cache_count = re.subn(
              r'(src="./js/app\\.js\\?v=)[^"]+',
              lambda match: match.group(1) + cache_version,
              html,
              count=1,
          )
          if cache_count != 1:
              raise SystemExit("Could not find the app.js cache-busting URL in index.html")

          path.write_text(html, encoding="utf-8")
          print(f"Application version: {version}")
          print(f"JavaScript cache key: {cache_version}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
