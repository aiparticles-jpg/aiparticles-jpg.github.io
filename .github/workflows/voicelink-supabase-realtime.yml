name: VoiceLink Supabase Realtime test

on:
  push:
    paths:
      - "backend/scripts/test-supabase-flow.js"
      - "backend/scripts/test-supabase-realtime.js"
      - "backend/scripts/test-supabase-envelope.mjs"
      - "backend/scripts/inspect-supabase-state.js"
      - "js/supabase-protocol.mjs"
      - "backend/scripts/apply-supabase-realtime-migration.js"
      - "backend/scripts/apply-supabase-message-timestamp-migration.js"
      - "backend/package.json"
      - "supabase/migrations/**"
      - ".github/workflows/voicelink-supabase-realtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voicelink-supabase-realtime
  cancel-in-progress: false

jobs:
  realtime-integration:
    name: Postgres Changes integration test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run isolated Supabase Postgres Changes test
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing GitHub Actions secret: SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing GitHub Actions secret: SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$SUPABASE_DB_URL" || (echo "Missing GitHub Actions secret: SUPABASE_DB_URL" && exit 1)
          node scripts/test-supabase-envelope.mjs
          node scripts/apply-supabase-realtime-migration.js
          node scripts/apply-supabase-message-timestamp-migration.js
          node scripts/test-supabase-flow.js
          node scripts/test-supabase-realtime.js

      - name: Verify redeemed Firefox invitation and inbox (read-only)
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DIAG_OWNER_ID: "67a312fc-d135-40f6-9b6c-b958c373e86b"
        run: node scripts/inspect-supabase-state.js
